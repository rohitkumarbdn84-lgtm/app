name: Build Raj Mock Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f "raj-mock-app-main/gradlew" ]; then
            echo "dir=raj-mock-app-main" >> "$GITHUB_OUTPUT"
          elif [ -f "gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "raj-mock-app-main/app/build.gradle" ] || [ -f "raj-mock-app-main/app/build.gradle.kts" ]; then
            echo "dir=raj-mock-app-main" >> "$GITHUB_OUTPUT"
          elif [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "Android Gradle project not found."
            echo "This ZIP may contain website files instead of an Android project."
            exit 1
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "Gradle wrapper missing. Cannot safely build this project yet."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-MOCK-TEST-APK
          path: |
            raj-mock-app-main/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
