
name: Build Raj Mock Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project files
        shell: bash
        run: |
          echo "Searching repository for Android project files..."
          find . -maxdepth 6 -type f \( \
            -name gradlew -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts -o \
            -name AndroidManifest.xml -o \
            -name package.json -o \
            -name index.html \
          \) -print | head -200

      - name: Find Android Gradle project
        id: project
        shell: bash
        run: |
          WRAPPER=$(find . -maxdepth 6 -type f -name gradlew -print -quit)

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR=$(dirname "$WRAPPER")
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo "Found Gradle wrapper in: $PROJECT_DIR"
            exit 0
          fi

          SETTINGS=$(find . -maxdepth 6 -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo "Found Gradle project in: $PROJECT_DIR"
            exit 0
          fi

          echo "ERROR: No Android Gradle project or Gradle wrapper found."
          echo "A website-only ZIP cannot be built directly as an Android APK."
          exit 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          elif command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug --no-daemon
          else
            echo "ERROR: Gradle is not available."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-MOCK-TEST-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
